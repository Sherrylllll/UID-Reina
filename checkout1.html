<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <main>
        <!--Checkout's 1st page's header part containing the checkout heading and progress bar-->
        <section class="checkout1-header">

            <h1>Checkout</h1>
            <div class="progressbar-bg">
                <div class="progressbar-fill"></div>
            </div>
        </section>

        <!--Checkout1's fill-in forms section-->
        <form>
            <!--Checkout's 1st page fill-in forms Address section-->
            <section class="address-form">
                <h2 class="form-category-title">Address</h2>
                <div class="address-staddress">
                    <p>Street Address</p>
                    <input type="text" placeholder="Type here...">
                </div>
                <div class="address-suburb">
                    <p>Suburb</p>
                    <input type="text" placeholder="Type here...">
                </div>
                <div class="address-state">
                    <p>State</p>
                    <input type="text" placeholder="Type here...">
                </div>
                <div class="address-pincode">
                    <p>Post Code</p>
                    <input type="text" placeholder="Type here...">
                </div>
            </section>

            <!--Checkout's 1st page fill-in forms Contact section-->
            <section class="contact-form">
                <h2 class="form-category-title">Contact</h2>
                <div class="contact-email">
                    <p>Email Address</p>
                    <input type="email" placeholder="Type here...">
                </div>
                <div class="contact-phone">
                    <p>Phone</p>
                    <input type="tel" placeholder="Type here...">
                </div>
            </section>

            <!--Checkout's 1st page fill-in forms Additional inst section-->
            <section class="addinst-form">
                <h2 class="form-category-title">Additional Instructions</h2>
                <div class="addinst-part">
                    <p>Instructions for delivery (ex. leave it infront of the door)</p>
                    <textarea placeholder="Type here..."></textarea>
                </div>
            </section>
        </form>

        <a href="checkout2.html" class="checkout1-next">Next</a>
    </main>


</body>

</html>
