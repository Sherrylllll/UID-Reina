<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <!--Menu button-->
            <button onclick="" class="mobile-menu-button">
                <img src="icons/menu-light.svg" alt="menu button" class="menu-icon">
            </button>

            <!--Reina home toggle-->
            <a href="index.html" class="nav-logo">Reina</a>

            <!--Desktop Left side links-->
            <div class="desktop-left-links">
                <!--Home toggle in left links-->
                <a href="index.html">
                    Home
                </a>

                <!--Create account button-->
                <a href="">
                    Create Account
                </a>

                <!--Back toggle-->
                <a href="" class="nav-back">
                    Back
                </a>
            </div>



            <!--Mobile Right side buttons-->
            <div class="mobile-right-buttons">
                <!--Search button-->
                <a href="search.html">
                    <img src="icons/search-light.svg" alt="search button" class="search-icon">
                </a>

                <!--Shopping bag button-->
                <a href="cartpage.html">
                    <img src="icons/bag-light.svg" alt="bag button" class="bag-icon">
                </a>
            </div>

            <!--Desktop Right side buttons-->
            <div class="desktop-right-buttons">

                <!--Wishlist button-->
                <a href="">
                    <img src="icons/heart-light.svg" alt="Wishlist button" class="wishlist-icon">
                </a>

                <!--Account button-->
                <a href="">
                    <img src="icons/user-light.svg" alt="account button" class="account-icon">
                </a>

                <!--Search button-->
                <a href="search.html">
                    <img src="icons/search-light.svg" alt="search button" class="search-icon">
                </a>

                <!--Shopping bag button-->
                <a href="cartpage.html">
                    <img src="icons/bag-light.svg" alt="bag button" class="bag-icon">
                </a>
            </div>
        </nav>

        <!--Menu overlay-->
        <div class="menu-overlay">
            <!--Menu heading & close button-->
            <div class="menu-overlay-top">
                <h3>Menu</h3>
                <button onclick="">
                    <img src="icons/close-light.svg" alt="menu button" class="menu-icon">
                </button>

            </div>

            <!--Menu links to pages list-->
            <ul class="menu-linklist">
                <li> <a href="index.html">Home</a> </li>
                <li> <a href="">Account</a> </li>
                <li> <a href="">Create Account</a> </li>
                <li> <a href="">Wishlist</a> </li>
                <li> <a href="browse.html">Browse</a> </li>
                <li> <a href="">Back</a> </li>
            </ul>
        </div>
    </header>

    <main>
        <section class="confirmation-content">

            <h1>Confirmation</h1>

            <!--Tick circle div-->
            <div class="tick-circle">
                <i class="fa-solid fa-check"></i>
            </div>

            <!--order confirmation and estimated delivery-->
            <p>Your order has been placed</p>
            <p>Estimated delivery: 1st July 2026, 10am</p>
            

            <!--Continue shopping button link to browse page-->
            <a href="browse.html">Continue Shopping</a>

        </section>
    </main>

    <footer>
        <p>&copy; 2025 Sharvari Rubade — Reina Melbourne</p>
    </footer>

</body>
<script src="script.js"></script>
</html>
